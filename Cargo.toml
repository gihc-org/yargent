[package]
name = "yargent"
version = "0.1.0"
edition = "2024"
description = "A Rust AI coding agent — cross-platform clone of aider.ai"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# HTTP client — explicitly disable default features to drop native-tls/openssl.
# rustls-tls keeps us pure-Rust on the TLS side, which matters for Termux/Android
# where building openssl from source is painful and we'd otherwise link glibc-isms.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# JSON / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Ergonomic error handling for a binary crate
anyhow = "1"

# async fn in traits with dyn-dispatch support (until Rust's native async-fn-in-trait
# is fully dyn-compatible we still want this for `Box<dyn LLMProvider>`)
async-trait = "0.1"
futures-util = "0.3.32"
async-stream = "0.3.6"
rustyline = "18.0.0"
dirs = "6.0.0"

# BPE tokenizer used for context-size estimates. Pure Rust, bundles its own
# merge tables — no C deps, no network calls. We use `cl100k_base` as a
# universal approximation; it's exact for OpenAI models and a reasonable
# estimate for DeepSeek/Anthropic (the real tokenizers are private but token
# counts come out within ~10% in practice for code and English).
tiktoken-rs = "0.11"

# Diff library used to preview SEARCH/REPLACE edits before applying them.
# Pure-Rust; we use its unified-diff output and colorize the +/- lines with
# raw ANSI escapes (no terminal-color crate dependency).
similar = "3"

# Tree-sitter + per-language grammars for the repo map. Tree-sitter itself is
# C, and each grammar crate compiles a C parser via its build.rs. We accept
# this native build dependency (Termux: `pkg install clang`) because the
# alternative — running a separate parser per language — is much more code
# and tree-sitter's parsers are notoriously portable.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# .gitignore-aware file enumeration. Pure-Rust, from the ripgrep ecosystem.
ignore = "0.4"

# TOML parser for the user config file at $XDG_CONFIG_HOME/yargent/config.toml.
# Pure-Rust, no native deps.
toml = "1"
